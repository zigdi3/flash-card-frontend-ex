<section
  class="w-full min-h-screen flex flex-col items-center relative"
>
  @if(isLoading()){
  <app-loading />
  } @else if(cardList().length > 0){
  <section
    class="w-full max-w-2xl flex flex-col gap-y-10 relative mx-auto z-10 pt-4"
  >
    @for (c of cardList(); track c.gitHubUrl) {
    <app-card [card]="c" />
    } @empty {
    <app-no-content
      title="Nenhum card encontrado"
      description="Parece que você ainda não adicionou nenhum card. Clique abaixo para criar o primeiro!"
      actionLabel="Criar novo card"
      (action)="goToRegisterCard()"
    />
    }
  </section>
  } @if(cardList().length > 0){
  <div
    class="mb-6 w-full max-w-2xl flex justify-center mx-auto py-3 relative z-10"
  >
    <z-button
      variant="primary"
      class="fixed bottom-6 right-6 w-14 h-14 rounded-full flex items-center justify-center shadow-lg cursor-pointer"
      (click)="goToRegisterCard()"
    >
      <svg
        xmlns="http://www.w3.org/2000/svg"
        class="h-6 w-6 text-white"
        fill="none"
        viewBox="0 0 24 24"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="M12 4v16m8-8H4"
        />
      </svg>
    </z-button>
  </div>
  }
</section>
