<section class="mx-auto w-max p-6 rounded-lg shadow-md z-10 mt-4
                bg-white/10 backdrop-blur-md border border-white/40">
  <h2 class="text-center mx-auto my-1 z-10 text-gray-800 font-semibold">Create Card</h2>
  
  <form [formGroup]="cardRegisterForm"
        (ngSubmit)="saveCard()"
        class="space-y-4 w-105 z-50">
    
    <z-form-field label="Name">
      <input z-input type="text"
             formControlName="nameControl"
             class="w-full bg-white/50 backdrop-blur-sm"
             placeholder="Digite seu nome"/>
    </z-form-field>

    <z-form-field label="GitHub Link">
      <input z-input type="url"
             formControlName="githubControl"
             class="w-full bg-white/50 backdrop-blur-sm"
             placeholder="https://github.com/usuario"/>
    </z-form-field>

    <z-form-field label="LinkedIn Link">
      <input z-input type="url"
             formControlName="linkedinControl"
             class="w-full bg-white/50 backdrop-blur-sm"
             placeholder="https://linkedin.com/in/usuario"/>
    </z-form-field>

    <z-button type="submit" variant="primary" class="w-full">Salvar</z-button>
  </form>

  <div class="pt-3">
    <z-button type="button" variant="warning" (click)="goToViewCard()">
      Ver cards...
    </z-button>
  </div>
</section>
