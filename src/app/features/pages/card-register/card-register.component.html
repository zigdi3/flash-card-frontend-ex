<div class="card-register space-y-4 p-6 bg-white rounded-lg shadow-md">
  <form
    [formGroup]="cardRegisterForm"
    (ngSubmit)="saveCard()"
    class="space-y-4"
  >
    <z-form-field label="Name">
      <input
        z-input
        type="text"
        formControlName="nameControl"
        class="w-full"
        placeholder="Digite seu nome"
      />
    </z-form-field>

    <z-form-field label="GitHub Link">
      <input
        z-input
        type="url"
        formControlName="githubControl"
        class="w-full"
        placeholder="https://github.com/usuario"
      />
    </z-form-field>

    <z-form-field label="LinkedIn Link">
      <input
        z-input
        type="url"
        formControlName="linkedinControl"
        class="w-full"
        placeholder="https://linkedin.com/in/usuario"
      />
    </z-form-field>

    <z-button type="submit" variant="primary" class="w-full"> Salvar </z-button>
  </form>

  <div class="pt-3">
    <z-button type="button" variant="warning" (click)="goToViewCard()">
      Ver cards..
    </z-button>
  </div>
</div>
